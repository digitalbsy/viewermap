<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>عارض ملفات الخرائط - بنك الأهداف</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f18; color: #f3f4f6; font-family: 'Tajawal', sans-serif; }
        #map { position: absolute; inset: 0; background: #0a0f18; }

        .upload-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(17, 24, 39, 0.95);
            border: 2px solid #f59e0b; border-radius: 10px;
            padding: 20px 30px; text-align: center;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
            backdrop-filter: blur(10px); min-width: 340px;
        }
        .upload-panel h1 { color: #f59e0b; font-size: 1.1rem; margin-bottom: 15px; }
        .upload-panel label {
            display: inline-block; padding: 12px 30px;
            background: #f59e0b; color: #0a0f18;
            border-radius: 6px; cursor: pointer;
            font-weight: 700; font-size: 0.95rem;
            transition: all 0.2s;
        }
        .upload-panel label:hover { background: #d97706; transform: translateY(-2px); }
        .upload-panel input[type=file] { display: none; }
        .upload-panel .status { margin-top: 12px; font-size: 0.85rem; color: #9ca3af; }

        .custom-marker { width: 30px; height: 30px; position: relative; }
        .custom-marker::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(0,229,255,0.5), transparent 70%);
            border-radius: 50%; animation: pulse 2s infinite;
        }
        .custom-marker::after {
            content: ''; position: absolute; inset: 8px;
            border: 2px solid #00e5ff; border-radius: 50%;
            box-shadow: 0 0 10px #00e5ff, inset 0 0 5px rgba(0,229,255,0.5);
            background: rgba(0,0,0,0.5);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 0.2; }
        }

        /* ── إخفاء غلاف Leaflet الافتراضي ليظهر تصميمنا نحن ── */
        .leaflet-popup-content-wrapper {
            background: transparent !important; 
            border: none !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8) !important;
            padding: 0 !important;
            border-radius: 12px !important;
        }
        .leaflet-popup-content { margin: 0 !important; width: auto !important; }
        .leaflet-popup-tip-container { display: none !important; }
        .leaflet-popup-close-button { display: none !important; } /* إخفاء زر الإغلاق الافتراضي */

        .custom-tooltip {
            background: #111827 !important; color: #f3f4f6 !important;
            border: 1px solid #f59e0b !important; border-radius: 4px !important;
            font-family: 'Tajawal', sans-serif !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="upload-panel" id="panel">
        <h1>عارض ملفات الخرائط (KMZ / KML)</h1>
        <label for="file">اختيار ملف<input type="file" id="file" accept=".kmz,.kml" /></label>
        <div class="status" id="status">أو اسحب الملف هنا مباشرة</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <script>
        const map = L.map('map', { center: [24.7136, 46.6753], zoom: 5 });

        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri'
        }).addTo(map);

        let layerGroup = null;
        const fileInput = document.getElementById('file');
        const status = document.getElementById('status');
        const panel = document.getElementById('panel');

        fileInput.addEventListener('change', async (e) => {
            if (e.target.files[0]) await loadFile(e.target.files[0]);
        });

        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
            panel.style.borderColor = '#00e5ff';
        });
        document.body.addEventListener('dragleave', (e) => {
            e.preventDefault();
            panel.style.borderColor = '#f59e0b';
        });
        document.body.addEventListener('drop', async (e) => {
            e.preventDefault();
            panel.style.borderColor = '#f59e0b';
            if (e.dataTransfer.files[0]) await loadFile(e.dataTransfer.files[0]);
        });

        async function loadFile(file) {
            try {
                status.textContent = 'جارٍ قراءة الملف...';
                let kmlText;

                if (file.name.toLowerCase().endsWith('.kmz')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    const kmlFileName = Object.keys(zip.files).find(name =>
                        name.toLowerCase().endsWith('.kml') && !zip.files[name].dir
                    );
                    if (!kmlFileName) throw new Error('لا يوجد ملف KML داخل KMZ');
                    kmlText = await zip.files[kmlFileName].async('text');
                } else {
                    kmlText = await file.text();
                }

                status.textContent = 'جارٍ التحليل...';
                const parser = new DOMParser();
                const kmlDoc = parser.parseFromString(kmlText, 'text/xml');

                if (kmlDoc.querySelector('parsererror')) throw new Error('ملف KML غير صالح');

                const geojson = toGeoJSON.kml(kmlDoc);

                if (!geojson.features || geojson.features.length === 0) {
                    throw new Error('لا توجد عناصر في الملف');
                }

                if (layerGroup) map.removeLayer(layerGroup);

                layerGroup = L.geoJSON(geojson, {
                    pointToLayer: (feature, latlng) => {
                        const icon = L.divIcon({
                            className: 'custom-marker-wrapper',
                            html: '<div class="custom-marker"></div>',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });
                        return L.marker(latlng, { icon: icon });
                    },
                    style: () => ({
                        color: '#00e5ff',
                        weight: 2,
                        fillColor: '#00e5ff',
                        fillOpacity: 0.15,
                        dashArray: '6 4'
                    }),
                    onEachFeature: (feature, layer) => {
                        const props = feature.properties || {};
                        const name = props.name || 'بدون اسم';
                        
                        let desc = props.description || '';
                        
                        // استخراج النص من الكائن إذا لزم الأمر
                        if (typeof desc === 'object' && desc !== null) {
                            desc = desc.value || desc.innerHTML || desc.textContent || '';
                        }

                        // تمرير الكود كما هو (لأنه يحتوي على تصميمنا الجاهز)
                        layer.bindPopup(desc, { maxWidth: 400, minWidth: 360, className: 'custom-leaflet-popup' });
                        layer.bindTooltip(name, { direction: 'top', className: 'custom-tooltip' });
                    }
                }).addTo(map);

                const bounds = layerGroup.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [80, 80], maxZoom: 15 });

                status.textContent = `✔ تم تحميل ${geojson.features.length} عنصراً`;
                panel.style.borderColor = '#10b981';
            } catch (err) {
                console.error(err);
                status.textContent = '✖ ' + err.message;
                panel.style.borderColor = '#ef4444';
            }
        }
    </script>
</body>
</html>
